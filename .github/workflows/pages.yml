name: Project website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - example/core-profiles/*.yaml
      - tool/build_site.py
      - .github/workflows/pages.yml
      - .github/tests/test_website.py
  pull_request:
    paths:
      - site/**
      - example/core-profiles/*.yaml
      - tool/build_site.py
      - .github/workflows/pages.yml
      - .github/tests/test_website.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-website-${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/configure-pages@v5
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - name: Test website build invariants
        run: python3 -B -m unittest discover -s .github/tests -p 'test_website.py' -v
      - name: Build and validate static website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://idy.github.io/sing-box-flutter/' }}
        run: python3 -B tool/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
