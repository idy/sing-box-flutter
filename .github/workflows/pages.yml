name: Project website

on:
  # Every new main revision gets a successor build, even for non-website edits.
  push:
    branches: [main]
  pull_request:
    paths:
      - site/**
      - example/core-profiles/*.yaml
      - tool/build_site.py
      - .github/workflows/pages.yml
      - .github/tests/test_website.py
      - .github/workflows/native-core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      production: ${{ steps.production.outputs.eligible }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Determine production deployment
        id: production
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          python3 -I - <<'PY'
          import os
          # Actions expressions compare strings case-insensitively; Python does not.
          eligible = (os.environ['WORKFLOW_REF'] == 'refs/heads/main' and
                      os.environ['WORKFLOW_EVENT'] in ('push', 'workflow_dispatch'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('eligible=' + str(eligible).lower() + '\n')
          PY
      - uses: actions/configure-pages@v5
        id: pages
        if: steps.production.outputs.eligible == 'true'
      - name: Test website build invariants
        run: python3 -B -m unittest discover -s .github/tests -p 'test_website.py' -v
      - name: Build and validate static website
        env:
          SITE_URL: ${{ steps.pages.outputs.host && format('https://{0}{1}', steps.pages.outputs.host, steps.pages.outputs.base_path) || 'https://idy.github.io/sing-box-flutter/' }}
        run: python3 -B tool/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site

  deploy:
    if: needs.build.outputs.production == 'true'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: project-website-production
      # Keep the latest revision queued even if an older build finishes later.
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the built revision is still current
        id: revision
        env:
          PAGES_BUILT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen
          # This runs after acquiring the production deployment lock.
          url = (os.environ['GITHUB_API_URL'] + '/repos/' +
                 os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/main')
          request = Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                         'Accept': 'application/vnd.github+json', 'Cache-Control': 'no-cache'})
          with urlopen(request, timeout=30) as response:
              current = json.load(response).get('object', {}).get('sha')
          built = os.environ['PAGES_BUILT_SHA']
          if any(not isinstance(sha, str) or re.fullmatch(r'[0-9a-f]{40}', sha) is None for sha in (current, built)):
              raise SystemExit('Could not verify the current main revision')
          deploy = current == built
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('current=' + str(deploy).lower() + '\n')
          print('Deploying current main revision' if deploy else 'Skipping superseded website build')
          PY
      - uses: actions/configure-pages@v5
        if: steps.revision.outputs.current == 'true'
      - name: Deploy website
        id: deployment
        if: steps.revision.outputs.current == 'true'
        uses: actions/deploy-pages@v4
