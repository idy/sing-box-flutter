name: Publish native artifacts

# workflow_run loads this workflow from the default branch, not the built tag.
on:
  workflow_run:
    workflows: [Native core]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-native:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.repository == 'idy/sing-box-flutter'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    concurrency:
      group: native-publish-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # On workflow_run, github.sha is the independently trusted default head.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify native run and main-branch ancestry before reading artifacts
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
          TRUSTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -I .github/scripts/publish_native_release.py --run-id "$NATIVE_RUN_ID" --check-run
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-core-release
          path: .build/release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish verified native artifacts using trusted default-branch code
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_TAG: ${{ steps.gate.outputs.native_tag }}
          TRUSTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -I .github/scripts/publish_native_release.py --directory .build/release --run-id "$NATIVE_RUN_ID" --tag "$RELEASE_TAG"
